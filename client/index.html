<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="description" content="Track and manage all your recurring subscriptions in one place. Monitor spending, get renewal reminders, and take control of your subscription expenses." />
    <title>PocketTrack - Subscription Management Made Easy</title>

    <!-- PWA: Theme color for browser chrome -->
    <meta name="theme-color" content="#0f172a" />
    
    <!-- PWA: iOS-specific meta tags for standalone mode -->
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fira+Code:wght@300..700&family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Oxanium:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <!-- PWA: Service Worker Registration -->
    <script>
      // PWA: Register service worker for offline support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('PWA: Service Worker registered successfully:', registration.scope);
              
              // PWA: Check for updates
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('PWA: New content available, please refresh.');
                  }
                });
              });
            })
            .catch((error) => {
              console.log('PWA: Service Worker registration failed:', error);
            });
        });
      }
    </script>
    
    <!-- Plaid Link SDK with cache busting -->
    <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js?v=2025103101"></script>
    
    <!-- Plaid SDK Load Detection -->
    <script>
      // Defensive check: Verify Plaid SDK loaded successfully
      window.addEventListener('load', function() {
        if (typeof window.Plaid === 'undefined') {
          console.error('[PLAID-SDK] CRITICAL: Plaid SDK failed to load! Check Content Security Policy.');
          console.error('[PLAID-SDK] Expected: window.Plaid object');
          console.error('[PLAID-SDK] Actual: undefined');
          console.error('[PLAID-SDK] CSP may be blocking https://cdn.plaid.com');
          
          // Set global flag for error handling
          window.plaidLoadFailed = true;
          
          // Dispatch custom event for React components to listen
          window.dispatchEvent(new CustomEvent('plaidLoadStatusChanged', { 
            detail: { failed: true } 
          }));
        } else {
          console.log('[PLAID-SDK] Successfully loaded');
          window.plaidLoadFailed = false;
          
          // Dispatch success event as well
          window.dispatchEvent(new CustomEvent('plaidLoadStatusChanged', { 
            detail: { failed: false } 
          }));
        }
      });
    </script>
    
    <!-- Plaid OAuth Redirect Handler -->
    <script>
      // Handle OAuth redirect from Plaid (mobile flow)
      // When user returns from Plaid authentication, URL contains oauth_state_id
      // IMPORTANT: Set this flag synchronously so it's available when resume script runs
      const urlParams = new URLSearchParams(window.location.search);
      const hasOAuthState = urlParams.has('oauth_state_id');
      
      if (hasOAuthState) {
        console.log('[PLAID-OAUTH] Detected OAuth redirect from Plaid, will resume Link flow...');
        window.plaidOAuthRedirect = true;
      } else {
        window.plaidOAuthRedirect = false;
      }
    </script>
    
    <!-- Plaid Hosted Link Callback Handler -->
    <script>
      // Handle return from Hosted Link (mobile WebView flow)
      // Poll server for callback result (survives native browser → WebView boundary)
      
      let isProcessingCallback = false;
      
      async function checkPlaidCallback() {
        // Prevent duplicate processing
        if (isProcessingCallback) {
          console.log('[PLAID-CALLBACK] Already processing callback, skipping...');
          return;
        }
        
        console.log('[PLAID-CALLBACK] Checking server for callback result...');
        
        try {
          // Poll server for callback result (stored server-side by /plaid/callback)
          const response = await fetch('/api/plaid/callback-result', {
            credentials: 'include'
          });
          
          if (!response.ok) {
            console.log('[PLAID-CALLBACK] Not authenticated or error checking callback');
            return;
          }
          
          const result = await response.json();
          
          if (result.found) {
            console.log('[PLAID-CALLBACK] Detected Hosted Link callback result from server');
            isProcessingCallback = true;
            
            try {
              if (result.publicToken) {
                console.log('[PLAID-CALLBACK] Processing successful bank connection');
                
                // Exchange public token for access token
                const exchangeResponse = await fetch('/api/exchange_public_token', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  credentials: 'include',
                  body: JSON.stringify({ public_token: result.publicToken })
                });
                
                if (!exchangeResponse.ok) {
                  throw new Error('Failed to exchange token');
                }
                
                console.log('[PLAID-CALLBACK] Token exchanged successfully');
                
                // Get return path and redirect
                const returnPath = sessionStorage.getItem('plaid_return_path') || '/';
                sessionStorage.removeItem('plaid_return_path');
                
                // Show success message
                alert('Bank connected successfully!');
                
                // Reload to show updated data
                window.location.href = returnPath;
              } else if (result.error) {
                console.log('[PLAID-CALLBACK] Bank connection failed or cancelled:', result.error);
                
                if (result.error !== 'user_exited') {
                  alert(`Bank connection failed: ${result.errorMessage || result.error}`);
                }
                
                // Clear return path
                sessionStorage.removeItem('plaid_return_path');
              }
            } catch (error) {
              console.error('[PLAID-CALLBACK] Error processing callback result:', error);
              sessionStorage.removeItem('plaid_return_path');
            } finally {
              isProcessingCallback = false;
            }
          } else {
            console.log('[PLAID-CALLBACK] No pending callback found on server');
          }
        } catch (error) {
          console.error('[PLAID-CALLBACK] Error checking callback:', error);
        }
      }
      
      // Run immediately when script loads
      checkPlaidCallback();
      
      // Also check when page loads
      window.addEventListener('load', checkPlaidCallback);
      
      // CRITICAL: Check when WebView regains focus after native browser closes
      window.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
          console.log('[PLAID-CALLBACK] WebView became visible, checking for callback...');
          checkPlaidCallback();
        }
      });
      
      // Additional fallback for when window regains focus
      window.addEventListener('focus', function() {
        console.log('[PLAID-CALLBACK] Window focused, checking for callback...');
        checkPlaidCallback();
      });
    </script>
    
    <!-- Plaid Link Event Handler -->
    <script>
      console.log('[PLAID-LINK] Initializing Connect Bank handler with React Native bridge support...');
      
      // Auto-resume Plaid Link if returning from OAuth redirect
      if (window.plaidOAuthRedirect) {
        console.log('[PLAID-OAUTH] Resuming Plaid Link flow after OAuth redirect...');
        
        window.addEventListener('load', async function() {
          // Wait for Plaid SDK to load
          if (typeof window.Plaid === 'undefined') {
            console.error('[PLAID-OAUTH] Cannot resume - Plaid SDK not loaded');
            return;
          }
          
          try {
            // Retrieve the original link token from sessionStorage
            const link_token = sessionStorage.getItem('plaid_link_token');
            
            if (!link_token) {
              console.error('[PLAID-OAUTH] Cannot resume - no link token found in sessionStorage');
              // Clean up sessionStorage and URL, let user try again
              sessionStorage.removeItem('plaid_return_path');
              window.history.replaceState({}, document.title, window.location.pathname);
              return;
            }
            
            console.log('[PLAID-OAUTH] Reusing stored link token to resume OAuth flow');
            
            // Create Plaid Link handler with receivedRedirectUri to resume OAuth flow
            const handler = window.Plaid.create({
              token: link_token, // Reuse the original link token
              receivedRedirectUri: window.location.href, // Full URL with oauth params
              onSuccess: async (public_token, metadata) => {
                console.log('[PLAID-OAUTH] OAuth flow completed, exchanging token...');
                
                try {
                  const exchangeResponse = await fetch('/api/exchange_public_token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ public_token })
                  });
                  
                  if (!exchangeResponse.ok) throw new Error('Failed to exchange token');
                  
                  console.log('[PLAID-OAUTH] Token exchanged successfully');
                  
                  // Get return path and clean up sessionStorage
                  const returnPath = sessionStorage.getItem('plaid_return_path') || '/';
                  sessionStorage.removeItem('plaid_link_token');
                  sessionStorage.removeItem('plaid_return_path');
                  
                  // Redirect back to original page
                  console.log('[PLAID-OAUTH] Redirecting to:', returnPath);
                  window.location.href = returnPath;
                } catch (error) {
                  console.error('[PLAID-OAUTH] Error exchanging token:', error);
                  alert('Failed to connect bank. Please try again.');
                  // Clean up sessionStorage and URL
                  sessionStorage.removeItem('plaid_link_token');
                  sessionStorage.removeItem('plaid_return_path');
                  window.history.replaceState({}, document.title, window.location.pathname);
                }
              },
              onExit: (err, metadata) => {
                console.log('[PLAID-OAUTH] OAuth flow exited', { err, metadata });
                // Clean up sessionStorage and URL
                sessionStorage.removeItem('plaid_link_token');
                sessionStorage.removeItem('plaid_return_path');
                window.history.replaceState({}, document.title, window.location.pathname);
              },
              onEvent: (eventName, metadata) => {
                console.log('[PLAID-OAUTH] Event:', eventName, metadata);
              }
            });
            
            // Open Plaid Link to resume OAuth flow
            console.log('[PLAID-OAUTH] Opening Plaid Link with receivedRedirectUri to resume OAuth flow');
            handler.open();
            
          } catch (error) {
            console.error('[PLAID-OAUTH] Error resuming OAuth flow:', error);
            // Clean up sessionStorage and URL
            sessionStorage.removeItem('plaid_link_token');
            sessionStorage.removeItem('plaid_return_path');
            window.history.replaceState({}, document.title, window.location.pathname);
          }
        });
      }
      
      // FIX: Vanilla JS event delegation for Connect Bank button
      // NEW APPROACH: Try React Native bridge first, fall back to modal mode
      document.addEventListener('click', async (e) => {
        const el = e.target.closest('[data-action="connect-bank"]');
        if (!el) return;
        
        e.preventDefault();
        e.stopPropagation();
        
        console.log('[PLAID-LINK] Connect Bank button clicked');
        
        // Check if Plaid SDK loaded
        if (window.plaidLoadFailed || typeof window.Plaid === 'undefined') {
          console.error('[PLAID-LINK] Cannot proceed - Plaid SDK not loaded');
          alert('Bank connection is unavailable. The Plaid SDK failed to load. Please refresh the page and try again.');
          return;
        }
        
        // Disable button during processing
        el.disabled = true;
        
        // Preserve icon and update text only
        const textSpan = el.querySelector('span');
        const originalText = textSpan ? textSpan.textContent : el.textContent;
        if (textSpan) {
          textSpan.textContent = 'Connecting...';
        } else {
          el.textContent = 'Connecting...';
        }
        
        try {
          // Fetch link token from backend (always needed)
          console.log('[PLAID-LINK] Fetching link token...');
          const linkTokenResponse = await fetch('/api/create_link_token', {
            credentials: 'include'
          });
          
          if (!linkTokenResponse.ok) {
            const errorText = await linkTokenResponse.text();
            console.error('[PLAID-LINK] Link token creation failed:', {
              status: linkTokenResponse.status,
              statusText: linkTokenResponse.statusText,
              error: errorText
            });
            
            // Handle bank connection limit (403 error)
            if (linkTokenResponse.status === 403) {
              try {
                const errorData = JSON.parse(errorText);
                if (errorData.message) {
                  // Show upgrade message
                  const upgradeMessage = errorData.message;
                  const confirmUpgrade = confirm(`${upgradeMessage}\n\nWould you like to view upgrade options?`);
                  if (confirmUpgrade) {
                    window.location.href = '/pricing';
                  }
                  // Re-enable button
                  if (textSpan) {
                    textSpan.textContent = originalText;
                  } else {
                    el.textContent = originalText;
                  }
                  el.disabled = false;
                  return; // Exit without throwing
                }
              } catch (parseError) {
                // If JSON parsing fails, fall through to generic error
                console.error('[PLAID-LINK] Failed to parse 403 error response:', parseError);
              }
            }
            
            throw new Error(`Failed to create link token: ${linkTokenResponse.statusText}. ${errorText}`);
          }
          
          const { link_token } = await linkTokenResponse.json();
          console.log('[PLAID-LINK] Link token received');
          
          // NEW APPROACH: Check if React Native WebView exists RIGHT NOW (not on page load)
          if (window.ReactNativeWebView) {
            console.log('[PLAID-LINK] ✅ React Native WebView detected - trying native SDK first');
            
            // Try React Native first with a timeout
            const reactNativeSuccess = await new Promise((resolve) => {
              let timeoutId;
              let messageHandler;
              
              // Set up one-time message listener for React Native response
              messageHandler = (event) => {
                try {
                  const data = JSON.parse(event.data);
                  console.log('[PLAID-LINK] Received message from React Native:', data.type);
                  
                  if (data.type === 'PLAID_SUCCESS') {
                    console.log('[PLAID-LINK] ✅ React Native succeeded!');
                    clearTimeout(timeoutId);
                    window.removeEventListener('message', messageHandler);
                    resolve({ success: true, publicToken: data.publicToken });
                  } else if (data.type === 'PLAID_EXIT' || data.type === 'PLAID_ERROR') {
                    console.log('[PLAID-LINK] React Native exited or errored');
                    clearTimeout(timeoutId);
                    window.removeEventListener('message', messageHandler);
                    resolve({ success: false, cancelled: true });
                  }
                } catch (error) {
                  // Ignore non-JSON messages
                }
              };
              
              window.addEventListener('message', messageHandler);
              
              // Set 5-second timeout - if React Native doesn't respond, fall back to modal
              timeoutId = setTimeout(() => {
                console.log('[PLAID-LINK] ⏱️ React Native timeout - falling back to modal mode');
                window.removeEventListener('message', messageHandler);
                resolve({ success: false, timeout: true });
              }, 5000);
              
              // Send link token to React Native
              window.ReactNativeWebView.postMessage(JSON.stringify({
                type: 'PLAID_LINK_TOKEN',
                linkToken: link_token
              }));
              console.log('[PLAID-LINK] Link token sent to React Native, waiting for response...');
            });
            
            // If React Native succeeded, exchange token and we're done
            if (reactNativeSuccess.success) {
              console.log('[PLAID-LINK] Exchanging token from React Native...');
              const exchangeResponse = await fetch('/api/exchange_public_token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ public_token: reactNativeSuccess.publicToken })
              });
              
              if (!exchangeResponse.ok) {
                throw new Error('Failed to exchange token');
              }
              
              console.log('[PLAID-LINK] Token exchanged successfully - reloading page');
              window.location.reload();
              return;
            }
            
            // If user cancelled in React Native, re-enable button and exit
            if (reactNativeSuccess.cancelled) {
              console.log('[PLAID-LINK] User cancelled in React Native');
              el.disabled = false;
              if (textSpan) textSpan.textContent = originalText;
              else el.textContent = originalText;
              return;
            }
            
            // If timeout, fall through to modal mode below
            console.log('[PLAID-LINK] Falling back to standard modal mode');
          } else {
            console.log('[PLAID-LINK] No React Native WebView detected - using standard modal mode');
          }
          
          // Standard Plaid Link modal mode (desktop, mobile browsers, or React Native fallback)
          const plaidConfig = {
            token: link_token,
            onSuccess: async (public_token, metadata) => {
              console.log('[PLAID-LINK] Plaid Link success, exchanging token...');
              
              try {
                const exchangeResponse = await fetch('/api/exchange_public_token', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  credentials: 'include',
                  body: JSON.stringify({ public_token })
                });
                
                if (!exchangeResponse.ok) {
                  throw new Error('Failed to exchange token: ' + exchangeResponse.statusText);
                }
                
                const result = await exchangeResponse.json();
                console.log('[PLAID-LINK] Token exchanged successfully', result);
                
                // Trigger success callback if on smoke test page
                if (window.showPlaidResult) {
                  window.showPlaidResult('PASS: Bank connected successfully', true);
                }
                
                // Reload to show new bank connection
                setTimeout(() => window.location.reload(), 1000);
              } catch (error) {
                console.error('[PLAID-LINK] Error exchanging token:', error);
                if (window.showPlaidResult) {
                  window.showPlaidResult('FAIL: ' + error.message, false);
                } else {
                  alert('Failed to connect bank. Please try again.');
                }
                el.disabled = false;
                if (textSpan) textSpan.textContent = originalText;
                else el.textContent = originalText;
              }
            },
            onExit: (err, metadata) => {
              console.log('[PLAID-LINK] Plaid Link exited', { err, metadata });
              el.disabled = false;
              if (textSpan) textSpan.textContent = originalText;
              else el.textContent = originalText;
              
              if (err) {
                console.error('[PLAID-LINK] Plaid Link error:', err);
                if (window.showPlaidResult) {
                  window.showPlaidResult('FAIL: Bank connection cancelled or failed', false);
                } else {
                  alert('Bank connection cancelled or failed.');
                }
              }
            },
            onEvent: (eventName, metadata) => {
              console.log('[PLAID-LINK] Plaid Link event:', eventName, metadata);
            }
          };
          
          const handler = window.Plaid.create(plaidConfig);
          console.log('[PLAID-LINK] Opening Plaid Link modal...');
          handler.open();
          
        } catch (error) {
          console.error('[PLAID-LINK] Error in Connect Bank flow:', error);
          if (window.showPlaidResult) {
            window.showPlaidResult('FAIL: ' + error.message, false);
          } else {
            alert('Failed to connect bank. Please try again.');
          }
          el.disabled = false;
          if (textSpan) textSpan.textContent = originalText;
          else el.textContent = originalText;
        }
      });
    </script>
