<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="description" content="Track and manage all your recurring subscriptions in one place. Monitor spending, get renewal reminders, and take control of your subscription expenses." />
    <title>PocketTrack - Subscription Management Made Easy</title>
    
    <!-- PWA: Standard favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- PWA: Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- PWA: Theme color for browser chrome -->
    <meta name="theme-color" content="#0f172a" />
    
    <!-- PWA: iOS-specific meta tags for standalone mode -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PocketTrack" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- PWA: iOS splash screen background -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fira+Code:wght@300..700&family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Oxanium:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <!-- PWA: Service Worker Registration -->
    <script>
      // PWA: Register service worker for offline support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('PWA: Service Worker registered successfully:', registration.scope);
              
              // PWA: Check for updates
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('PWA: New content available, please refresh.');
                  }
                });
              });
            })
            .catch((error) => {
              console.log('PWA: Service Worker registration failed:', error);
            });
        });
      }
    </script>
    
    <!-- Plaid Link SDK with cache busting -->
    <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js?v=2025103101"></script>
    
    <!-- Plaid SDK Load Detection -->
    <script>
      // Defensive check: Verify Plaid SDK loaded successfully
      window.addEventListener('load', function() {
        if (typeof window.Plaid === 'undefined') {
          console.error('[PLAID-SDK] CRITICAL: Plaid SDK failed to load! Check Content Security Policy.');
          console.error('[PLAID-SDK] Expected: window.Plaid object');
          console.error('[PLAID-SDK] Actual: undefined');
          console.error('[PLAID-SDK] CSP may be blocking https://cdn.plaid.com');
          
          // Set global flag for error handling
          window.plaidLoadFailed = true;
          
          // Dispatch custom event for React components to listen
          window.dispatchEvent(new CustomEvent('plaidLoadStatusChanged', { 
            detail: { failed: true } 
          }));
        } else {
          console.log('[PLAID-SDK] Successfully loaded');
          window.plaidLoadFailed = false;
          
          // Dispatch success event as well
          window.dispatchEvent(new CustomEvent('plaidLoadStatusChanged', { 
            detail: { failed: false } 
          }));
        }
      });
    </script>
    
    <!-- Plaid OAuth Redirect Handler -->
    <script>
      // Handle OAuth redirect from Plaid (mobile flow)
      // When user returns from Plaid authentication, URL contains oauth_state_id
      // IMPORTANT: Set this flag synchronously so it's available when resume script runs
      const urlParams = new URLSearchParams(window.location.search);
      const hasOAuthState = urlParams.has('oauth_state_id');
      
      if (hasOAuthState) {
        console.log('[PLAID-OAUTH] Detected OAuth redirect from Plaid, will resume Link flow...');
        window.plaidOAuthRedirect = true;
      } else {
        window.plaidOAuthRedirect = false;
      }
    </script>
    
    <!-- Plaid Link Event Handler -->
    <script>
      console.log('[PLAID-LINK] Attaching event handler for Connect Bank buttons...');
      
      // WebView detection - React Native, Cordova, Capacitor, Expo, etc.
      function isWebView() {
        // Check for React Native WebView (modern versions)
        if (window.ReactNativeWebView !== undefined) {
          return true;
        }
        
        // Check for Cordova/PhoneGap
        if (window.cordova !== undefined || window.phonegap !== undefined) {
          return true;
        }
        
        // Check for Capacitor
        if (window.Capacitor !== undefined) {
          return true;
        }
        
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        
        // Check for Android WebView (has "wv" in user agent)
        if (/wv|WebView/i.test(userAgent)) {
          return true;
        }
        
        // Check for iOS WebView heuristics
        // iOS WebViews often lack "Safari/" in user agent while having "Mobile/"
        const isIOS = /iPhone|iPad|iPod/i.test(userAgent);
        const hasSafari = /Safari/i.test(userAgent);
        const hasMobile = /Mobile/i.test(userAgent);
        
        if (isIOS && hasMobile && !hasSafari) {
          // Likely an iOS WebView (in-app browser)
          return true;
        }
        
        // Additional iOS WebView check: WKWebView doesn't set navigator.standalone
        // but can be detected by missing Safari + present webkit
        if (isIOS && !hasSafari && /AppleWebKit/i.test(userAgent)) {
          return true;
        }
        
        return false;
      }
      
      // Cache detection results to avoid recalculating and ensure consistency
      const DEVICE_CONTEXT = (function() {
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const isMobileBrowser = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(userAgent.toLowerCase());
        const inWebView = isWebView();
        
        // Use OAuth only for mobile browsers that are NOT in a WebView
        const shouldUseOAuth = isMobileBrowser && !inWebView;
        
        return {
          isWebView: inWebView,
          isMobileBrowser: isMobileBrowser,
          shouldUseOAuthRedirect: shouldUseOAuth
        };
      })();
      
      // Log device detection result once
      if (DEVICE_CONTEXT.isWebView) {
        console.log('[PLAID-LINK] Device detection: WebView (will use modal mode)');
      } else if (DEVICE_CONTEXT.shouldUseOAuthRedirect) {
        console.log('[PLAID-LINK] Device detection: Mobile browser (will use OAuth redirect)');
      } else {
        console.log('[PLAID-LINK] Device detection: Desktop (will use modal)');
      }
      
      // Expose for use in event handlers
      const isMobile = DEVICE_CONTEXT.shouldUseOAuthRedirect;
      
      // Auto-resume Plaid Link if returning from OAuth redirect
      if (window.plaidOAuthRedirect) {
        console.log('[PLAID-OAUTH] Resuming Plaid Link flow after OAuth redirect...');
        
        window.addEventListener('load', async function() {
          // Wait for Plaid SDK to load
          if (typeof window.Plaid === 'undefined') {
            console.error('[PLAID-OAUTH] Cannot resume - Plaid SDK not loaded');
            return;
          }
          
          try {
            // Retrieve the original link token from sessionStorage
            const link_token = sessionStorage.getItem('plaid_link_token');
            
            if (!link_token) {
              console.error('[PLAID-OAUTH] Cannot resume - no link token found in sessionStorage');
              // Clean up URL and let user try again
              window.history.replaceState({}, document.title, window.location.pathname);
              return;
            }
            
            console.log('[PLAID-OAUTH] Reusing stored link token to resume OAuth flow');
            
            // Create Plaid Link handler with receivedRedirectUri to resume OAuth flow
            const handler = window.Plaid.create({
              token: link_token, // Reuse the original link token
              receivedRedirectUri: window.location.href, // Full URL with oauth params
              onSuccess: async (public_token, metadata) => {
                console.log('[PLAID-OAUTH] OAuth flow completed, exchanging token...');
                
                try {
                  const exchangeResponse = await fetch('/api/exchange_public_token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ public_token })
                  });
                  
                  if (!exchangeResponse.ok) throw new Error('Failed to exchange token');
                  
                  console.log('[PLAID-OAUTH] Token exchanged successfully');
                  
                  // Clean up sessionStorage
                  sessionStorage.removeItem('plaid_link_token');
                  
                  // Clean up URL and redirect to home
                  window.location.href = '/';
                } catch (error) {
                  console.error('[PLAID-OAUTH] Error exchanging token:', error);
                  alert('Failed to connect bank. Please try again.');
                  // Clean up sessionStorage and URL
                  sessionStorage.removeItem('plaid_link_token');
                  window.history.replaceState({}, document.title, window.location.pathname);
                }
              },
              onExit: (err, metadata) => {
                console.log('[PLAID-OAUTH] OAuth flow exited', { err, metadata });
                // Clean up sessionStorage and URL
                sessionStorage.removeItem('plaid_link_token');
                window.history.replaceState({}, document.title, window.location.pathname);
              },
              onEvent: (eventName, metadata) => {
                console.log('[PLAID-OAUTH] Event:', eventName, metadata);
              }
            });
            
            // Open Plaid Link to resume OAuth flow
            console.log('[PLAID-OAUTH] Opening Plaid Link with receivedRedirectUri to resume OAuth flow');
            handler.open();
            
          } catch (error) {
            console.error('[PLAID-OAUTH] Error resuming OAuth flow:', error);
            // Clean up sessionStorage and URL
            sessionStorage.removeItem('plaid_link_token');
            window.history.replaceState({}, document.title, window.location.pathname);
          }
        });
      }
      
      // FIX: Vanilla JS event delegation for Connect Bank button
      // Prevents overlay blocking and ensures reliable click handling
      document.addEventListener('click', async (e) => {
        const el = e.target.closest('[data-action="connect-bank"]');
        if (!el) return;
        
        e.preventDefault();
        e.stopPropagation();
        
        console.log('[PLAID-LINK] Connect Bank button clicked');
        
        // Check if Plaid SDK loaded
        if (window.plaidLoadFailed || typeof window.Plaid === 'undefined') {
          console.error('[PLAID-LINK] Cannot proceed - Plaid SDK not loaded');
          alert('Bank connection is unavailable. The Plaid SDK failed to load. Please refresh the page and try again.');
          return;
        }
        
        // Disable button during processing
        el.disabled = true;
        
        // Preserve icon and update text only
        const textSpan = el.querySelector('span');
        const originalText = textSpan ? textSpan.textContent : el.textContent;
        if (textSpan) {
          textSpan.textContent = 'Connecting...';
        } else {
          el.textContent = 'Connecting...';
        }
        
        try {
          // Fetch link token from backend
          console.log('[PLAID-LINK] Fetching link token...');
          
          // For mobile, include redirect_uri so Plaid can return after OAuth
          const redirectUri = isMobile ? window.location.href.split('?')[0] : null;
          const linkTokenUrl = redirectUri 
            ? `/api/create_link_token?redirect_uri=${encodeURIComponent(redirectUri)}`
            : '/api/create_link_token';
          
          const linkTokenResponse = await fetch(linkTokenUrl, {
            credentials: 'include'
          });
          
          if (!linkTokenResponse.ok) {
            throw new Error('Failed to create link token: ' + linkTokenResponse.statusText);
          }
          
          const { link_token } = await linkTokenResponse.json();
          console.log('[PLAID-LINK] Link token received', { isMobile, redirectUri });
          
          // Store link token in sessionStorage for OAuth redirect resume (mobile only)
          if (isMobile && redirectUri) {
            sessionStorage.setItem('plaid_link_token', link_token);
            console.log('[PLAID-LINK] Stored link token in sessionStorage for OAuth resume');
          }
          
          // Create and open Plaid Link
          const plaidConfig = {
            token: link_token,
            onSuccess: async (public_token, metadata) => {
              console.log('[PLAID-LINK] Plaid Link success, exchanging token...');
              
              try {
                const exchangeResponse = await fetch('/api/exchange_public_token', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  credentials: 'include',
                  body: JSON.stringify({ public_token })
                });
                
                if (!exchangeResponse.ok) {
                  throw new Error('Failed to exchange token: ' + exchangeResponse.statusText);
                }
                
                const result = await exchangeResponse.json();
                console.log('[PLAID-LINK] Token exchanged successfully', result);
                
                // Trigger success callback if on smoke test page
                if (window.showPlaidResult) {
                  window.showPlaidResult('PASS: Bank connected successfully', true);
                }
                
                // Redirect to dashboard to show connected bank
                setTimeout(() => window.location.href = '/', 1000);
              } catch (error) {
                console.error('[PLAID-LINK] Error exchanging token:', error);
                if (window.showPlaidResult) {
                  window.showPlaidResult('FAIL: ' + error.message, false);
                } else {
                  alert('Failed to connect bank. Please try again.');
                }
                el.disabled = false;
                if (textSpan) textSpan.textContent = originalText;
                else el.textContent = originalText;
              }
            },
            onExit: (err, metadata) => {
              console.log('[PLAID-LINK] Plaid Link exited', { err, metadata });
              el.disabled = false;
              if (textSpan) textSpan.textContent = originalText;
              else el.textContent = originalText;
              
              if (err) {
                console.error('[PLAID-LINK] Plaid Link error:', err);
                if (window.showPlaidResult) {
                  window.showPlaidResult('FAIL: Bank connection cancelled or failed', false);
                } else {
                  alert('Bank connection cancelled or failed.');
                }
              }
            },
            onEvent: (eventName, metadata) => {
              console.log('[PLAID-LINK] Plaid Link event:', eventName, metadata);
            }
          };
          
          // IMPORTANT: Do NOT set receivedRedirectUri on initial launch
          // Only set it when resuming from OAuth redirect (handled in OAuth redirect handler above)
          // Setting it too early causes Plaid Link to error before redirect
          
          const handler = window.Plaid.create(plaidConfig);
          
          console.log('[PLAID-LINK] Opening Plaid Link...', isMobile ? '(will use OAuth redirect)' : '(modal mode)');
          handler.open();
          
        } catch (error) {
          console.error('[PLAID-LINK] Error in Connect Bank flow:', error);
          if (window.showPlaidResult) {
            window.showPlaidResult('FAIL: ' + error.message, false);
          } else {
            alert('Failed to connect bank. Please try again.');
          }
          el.disabled = false;
          if (textSpan) textSpan.textContent = originalText;
          else el.textContent = originalText;
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
